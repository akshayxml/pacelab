<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>PaceLab · Running dashboard</title>
    <meta
      name="description"
      content="PaceLab: your running dashboard. Weekly, monthly and yearly mileage, year-over-year progress and best efforts from Strava or Intervals.icu."
    />
    <!-- ICO for older browsers, SVG for modern ones, PNG for iOS home screens. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved theme (dark by default) before first paint to avoid a flash.
      (function () {
        var saved = localStorage.getItem("pacelab-theme");
        var dark = saved !== "light";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
